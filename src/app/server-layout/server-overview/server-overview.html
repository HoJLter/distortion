<div class="container">
    <div class="top-panels">
        <server-description
            [serverName]="serverName"
        />
        @for (channelGroup of channelGroups; track $index){
            <channel-group
                [channels]="channelGroup.channels"
                [name]="channelGroup.name"
                [type]="channelGroup.type"
            />
        }
    </div>

    <profile
        [username]="username"
    />
</div>
